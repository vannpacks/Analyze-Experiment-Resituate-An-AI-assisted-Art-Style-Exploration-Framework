name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package release
        run: |
          mkdir -p dist/styleagent
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.venv' --exclude 'dist' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.next' \
            ./ dist/styleagent/
          cd dist
          zip -r styleagent.zip styleagent

      - uses: actions/upload-artifact@v4
        with:
          name: styleagent
          path: dist/styleagent.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/styleagent.zip
          generate_release_notes: true
