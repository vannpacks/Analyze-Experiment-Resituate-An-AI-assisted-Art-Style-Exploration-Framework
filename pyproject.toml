[project]
name = "styleagent"
version = "0.1.0"
description = "Local Style-AER application"
requires-python = ">=3.11"
dependencies = [
  "autogen-core",
  "autogen-ext[openai]",
  "fastapi",
  "numpy",
  "openai",
  "pillow",
  "platformdirs",
  "python-dotenv",
  "python-multipart",
  "requests",
  "uvicorn",
]

[project.scripts]
styleagent = "backend.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
